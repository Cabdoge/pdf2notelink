name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run build
      - run: python3 scripts/validate_release.py --tag "$GITHUB_REF_NAME"
      - name: Publish XPI and Zotero update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/pdf2notelink-${GITHUB_REF_NAME#v}.xpi" \
            dist/updates.json dist/SHA256SUMS \
            --verify-tag --latest \
            --title "pdf2notelink $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md
